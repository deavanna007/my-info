<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>My Info</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <style>
                :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #7f8c8d;
            --primary-color: #3498db;
            --accent-color: #2ecc71;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --card-bg: #2d3748;
            --text-color: #f7fafc;
            --text-muted: #a0aec0;
            --primary-color: #4299e1;
            --accent-color: #48bb78;
            --border-color: #4a5568;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: var(--transition);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .theme-toggle-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .theme-toggle-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .profile-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 25px;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .profile-info h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .profile-section {
            margin-bottom: 25px;
        }

        .profile-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            display: inline-block;
            padding-bottom: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            padding: 10px;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 500;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            text-decoration: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .tag:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        @media (max-width: 600px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
    <body>
    <div class="container">
    <header>
        <button class="theme-toggle-btn" id="themeToggle">Switch Theme</button>
    </header>
    <main class="profile-card">
        <div class="profile-header">
                <img class="avatar" id="avatarIcon" src="https://i.postimg.cc/D0VZHHFr/photo-2026-05-05-15-03-16.jpg" alt="Profile Image">
            <div class="profile-info">
                <h1 id="fullName">DEA VANNA</h1>
                <p id="headline">ICT & Electrical Student | Tech Innovator</p>
            </div>
        </div>
        <div class="profile-section">
            <h2>General Information</h2>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Focus Area</div>
                    <div class="info-value">Network & Electrical Engineering</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Current Track</div>
                    <div class="info-value">Grade 10I & Vocational Training</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Specialty</div>
                    <div class="info-value">Electrical Engineering & UI Design</div>
                </div>
            </div>
        </div>
        <div class="profile-section">
            <h2>Core Skills</h2>
            <div class="tag-container" id="skillsContainer">
            </div>
        </div>
        <div class="profile-section">
            <h2>Featured Projects</h2>
            <div class="tag-container" id="projectsContainer">
            </div>
        </div>
    </main>
</div>  
    <script>
            const profileData = {
        name: "DEA VANNA",
        title: "ICT & Electrical Student",
        skills: [
            "Python Automation", 
            "Front-End Web Development", 
            "Network Engineering", 
            "Industrial Motor Control", 
            "Logo & UI Design"
        ],
        projects: [
                { name: "VN Company Web App", link: "https://deavanna007.github.io/vn-company/" },
                { name: "Suprise Love Web App", link: "https://sendtomylove-isme-v.vercel.app/" },
                { name: "Rice Calculator Web App", link: "https://rc-cambodia-bydeavanna.vercel.app/" },
                { name: "Confession Of Love Web App", link: "https://love-confession-ismev.vercel.app/" },
                { name: "Birth Day Suprise", link: "https://foryou-tbb.vercel.app/"},
                { name: "Telegram Automation Bot", link: "#" }
            ],

        contact: [
                { name: "VN Company Web App", link: "https://deavanna007.github.io/vn-company/" },
                { name: "Suprise Love Web App", link: "https://sendtomylove-isme-v.vercel.app/" },
                { name: "Rice Calculator Web App", link: "https://rc-cambodia-bydeavanna.vercel.app/" },
                { name: "Confession Of Love Web App", link: "https://love-confession-ismev.vercel.app/" },
                { name: "Birth Day Suprise", link: "https://foryou-tbb.vercel.app/"},
                { name: "Telegram Automation Bot", link: "#" }
            ]
        };

    function loadProfile() {
        const skillsContainer = document.getElementById('skillsContainer');
        profileData.skills.forEach(skill => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = skill;
            skillsContainer.appendChild(span);
        });

        const projectsContainer = document.getElementById('projectsContainer');
        profileData.projects.forEach(project => {
            const linkAnchor = document.createElement('a'); 
            linkAnchor.className = 'tag'; 
            linkAnchor.textContent = project.name; 
            linkAnchor.href = project.link; 
            linkAnchor.target = '_blank'; 
            projectsContainer.appendChild(linkAnchor);
        });
    }

    const themeBtn = document.getElementById('themeToggle');
    
    const currentTheme = localStorage.getItem('theme') ? localStorage.getItem('theme') : null;

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeBtn.textContent = currentTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
    } else {
        themeBtn.textContent = 'Dark Mode';
    }

    themeBtn.addEventListener('click', () => {
        let theme = document.documentElement.getAttribute('data-theme');
        
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            themeBtn.textContent = 'Dark Mode';
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            themeBtn.textContent = 'Light Mode';
        }

    });

    window.onload = loadProfile;
    </script>
</footer>
</body>
</html>
